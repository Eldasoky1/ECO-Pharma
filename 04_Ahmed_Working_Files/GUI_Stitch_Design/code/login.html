<body class="bg-surface text-on-surface h-screen w-full flex flex-col justify-between items-center relative overflow-hidden">
<!-- Background Gradient -->
<div class="absolute inset-0 z-0 bg-gradient-to-br from-surface to-secondary-container opacity-50"></div>
<!-- Main Content Canvas -->
<main class="z-10 flex-grow flex items-center justify-center w-full px-margin-mobile md:px-margin-desktop">
<!-- Login Card (Surface Container Low, Level 1) -->
<div class="bg-surface-container-low rounded-xl p-8 w-full max-w-md shadow-sm border border-surface-container shadow-[0_4px_8px_rgba(0,104,91,0.04)]" relative>
<button id="theme-toggle" type="button" aria-label="Toggle dark mode" aria-pressed="false" class="absolute top-3 right-3 p-2 rounded-full text-on-surface-variant hover:bg-surface-container-high transition-colors cursor-pointer active:opacity-80"><span class="material-symbols-outlined block dark:hidden" aria-hidden="true">dark_mode</span><span class="material-symbols-outlined hidden dark:block" aria-hidden="true">light_mode</span></button>
<!-- Brand Header -->
<div class="text-center mb-8">
<div class="flex justify-center mb-4 text-primary">
<span aria-hidden="true" class="material-symbols-outlined" style="font-size: 48px; font-variation-settings: 'FILL' 1;">eco</span>
</div>
<h1 class="font-headline-sm text-headline-sm text-primary mb-2">Smart Eco-Pharma Hub</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Secure access to pharmacy operations</p>
</div>
<!-- Login Form -->
<form class="space-y-6">
<!-- Email Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-1 ml-4" for="email">Email Address</label>
<div class="relative">
<span aria-hidden="true" class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant" data-icon="mail">mail</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface font-body-lg text-body-lg rounded-full py-3 pl-12 pr-4 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="email" name="email" placeholder="Enter your email" required="" type="email" autocomplete="email">
</div>
</div>
<!-- Password Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-1 ml-4" for="password">Password</label>
<div class="relative">
<span aria-hidden="true" class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant" data-icon="lock">lock</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface font-body-lg text-body-lg rounded-full py-3 pl-12 pr-4 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="password" name="password" placeholder="Enter your password" required="" type="password" autocomplete="current-password">
</div>
</div>
<!-- Remember & Forgot -->
<div class="flex items-center justify-between px-2">
<label class="flex items-center space-x-2 cursor-pointer">
<input class="form-checkbox h-4 w-4 text-primary border-outline-variant rounded focus:ring-primary" type="checkbox">
<span class="font-body-md text-body-md text-on-surface-variant">Remember me</span>
</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors" href="#">Forgot Password?</a>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary text-on-primary font-label-lg text-label-lg rounded-full py-3 px-6 hover:bg-surface-tint active:opacity-80 transition-all duration-200 flex items-center justify-center space-x-2" type="submit">
<span>Sign In</span>
<span aria-hidden="true" class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
<p class="mt-6 text-center font-body-md text-body-md text-on-surface-variant">Don't have an account? <a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors" href="signup.html">Create Account</a></p>
</form>
<!-- Divider -->
<div class="mt-8 flex items-center justify-center space-x-4">
<div class="h-px bg-outline-variant flex-grow"></div>
<span class="font-label-md text-label-md text-on-surface-variant">Secure Login</span>
<div class="h-px bg-outline-variant flex-grow"></div>
</div>
</div>
</main>
<!-- Footer -->
<footer class="z-10 w-full py-4 text-center">
<p class="font-label-md text-label-md text-on-surface-variant">Smart Eco-Pharma Hub v0.1.0 © 2024</p>
</footer>
<script>
        // Simple form interaction prevention for prototype
        document.querySelector('form').addEventListener('submit', (e) => {
            e.preventDefault();
            window.location.href = 'dashboard.html';
            // Typically this would handle auth, for this UI demo we just prevent default.
            console.log('Login attempt');
        });
    </script>
