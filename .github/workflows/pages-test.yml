name: Pages Minimal Test
on:
  workflow_dispatch:
    branches: [prod]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
env:
  VITE_SUPABASE_URL: https://drzrxfmrxiitopjamchh.supabase.co
  VITE_SUPABASE_ANON_KEY: sb_publishable_wjA4UaR5teefeZzGaADjvQ_9n3FOp7b
  VITE_API_BASE: https://smart-eco-pharma.onrender.com
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-test
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4