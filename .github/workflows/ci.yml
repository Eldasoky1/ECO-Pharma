name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint with ruff
        run: ruff check smart_eco_pharma/
      - name: Type check with mypy
        run: mypy smart_eco_pharma/ --ignore-missing-imports
      - name: Run tests
        run: pytest smart_eco_pharma/tests/ -v --tb=short

  build:
    needs: lint-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t smart-eco-pharma .
      - name: Summary
        run: echo "Docker image built successfully. Ready for manual deploy to Render.com." >> $GITHUB_STEP_SUMMARY
